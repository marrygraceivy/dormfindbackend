ServerTokens Prod
ServerSignature Off
Timeout 40
KeepAlive On
KeepAliveTimeout 2
MaxKeepAliveRequests 100
<IfModule mpm_prefork_module>
StartServers 2
MinSpareServers 2
MaxSpareServers 4
MaxRequestWorkers 4
MaxConnectionsPerChild 500
</IfModule>
<Directory /var/www/html/public>
AllowOverride All
Options -Indexes
Require all granted
LimitRequestBody 12582912
</Directory>
